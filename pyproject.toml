[project]
name = "retina-telemetry"
version = "0.1.0"
description = "Node-side telemetry uplink for the RETINA passive radar fleet"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "datamodel-code-generator>=0.25",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retina_telemetry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Generated, so its layout is datamodel-codegen's business, not ours: E501
# because the spec's descriptions are longer than our limit, I001 because the
# generator does not separate import groups. Fixing either by hand would make
# `tools/generate-models.sh --check` fail on the next regeneration.
"retina_telemetry/wire/models.py" = ["E501", "I001"]

name: release

# Tag-driven, matching how every other image in the fleet is pinned: compose
# takes ${TELEMETRY_V:-v0.1.0}, so the tag here is the thing a node runs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tests are the gate. A tag that cannot pass them must not become an
      # image a node could pull.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      # The same gates as ci.yml, from the same script. Listing them here
      # separately is how this drifted: it was missing the dead-code check and
      # the format check for three days.
      - run: tools/check.sh

      - name: Version matches the tag
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(python -c "import tomllib,pathlib; \
            print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tagged" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $declared" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 is the fleet; amd64 is for anyone running it on a laptop against
      # the mock.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/offworldlabs/retina-telemetry:${{ github.ref_name }}
            ghcr.io/offworldlabs/retina-telemetry:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

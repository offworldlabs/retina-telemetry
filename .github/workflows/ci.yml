name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e '.[dev]'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Dead code
        run: tools/check-dead-code.sh

      # The spec is someone else's contract, so the models are derived from it
      # rather than maintained alongside it. This fails if the checked-in copy
      # has drifted, which is how a revision upstream announces itself.
      - name: Models match the spec
        run: tools/generate-models.sh --check

      - name: Test
        run: pytest -q --cov=retina_telemetry --cov-report=term

  image:
    # Only what a PR needs: proof the image builds for both architectures.
    # Publishing happens on a tag, below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

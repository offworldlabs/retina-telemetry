name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e '.[dev]'

      # Every gate lives in tools/check.sh so this workflow, release.yml and a
      # developer's terminal cannot disagree about what "green" means. They did:
      # the dead-code check and `ruff format --check` were added here and never
      # to release, so a tag could publish an image this job would have failed.
      - name: Gates
        run: tools/check.sh

      # Coverage is CI-only — it is a review aid rather than a gate, and adding
      # it to check.sh would slow the local loop for no benefit.
      - name: Coverage
        run: pytest -q --cov=retina_telemetry --cov-report=term

  image:
    # Only what a PR needs: proof the image builds for both architectures.
    # Publishing happens on a tag, below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
